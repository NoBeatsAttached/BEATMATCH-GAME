<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BEATMATCH</title>
<meta name="theme-color" content="#0c0622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BEATMATCH">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
:root{height:100%;background:#0c0622}
body{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:14px;-webkit-text-size-adjust:100%;touch-action:manipulation}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lilita+One&display=swap">
<style>
/* Layout: one-screen portrait game, max 480px; a full-bleed painted canvas (#bg) sits behind each screen's floating UI, #fx canvas on top for flying pickups */
:root{
  --bg:#0c0622; --ink:#ffffff; --muted:#c9bdf5; --outline:#1a0b33;
  --navy:#1d1d5e; --navy2:#2c2f8f; --panel:#ecebff;
  --gold:#ffc83d; --gold-d:#d9820c; --go:#3fe06e; --go-d:#13923d; --hot:#ff4f8b; --hot-d:#b5154f; --cyan:#45dcff; --violet:#7d5cff;
  --font-d:'Lilita One','Arial Rounded MT Bold',Impact,sans-serif; --font-b:'Baloo 2',ui-rounded,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
#bg,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}#fx{z-index:6;pointer-events:none}
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding:10px 16px 12px;gap:10px}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h2,h3{margin:0;font-family:var(--font-d);font-weight:400;letter-spacing:.01em;text-wrap:balance}
.ts{-webkit-text-stroke:5px var(--outline);paint-order:stroke fill}
.ts3{-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.num{font-variant-numeric:tabular-nums}

/* glossy game buttons */
.btn{position:relative;font-family:var(--font-d);font-size:19px;padding:9px 18px 12px;border-radius:18px;color:#fff;border:3px solid var(--outline);
  -webkit-text-stroke:4px rgba(26,11,51,.85);paint-order:stroke fill;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 4px 0 var(--outline);transition:transform .08s}
.btn::before{content:'';position:absolute;left:7px;right:7px;top:4px;height:38%;border-radius:12px 12px 8px 8px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.08));pointer-events:none}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 1px 0 var(--outline)}
.btn.go{background:linear-gradient(#8bff9f,var(--go) 45%,var(--go-d))}
.btn.gold{background:linear-gradient(#fff09a,var(--gold) 45%,var(--gold-d))}
.btn.hot{background:linear-gradient(#ffa3c2,var(--hot) 45%,var(--hot-d))}
.btn.dim{background:linear-gradient(#a38bff,#6a4fe0 45%,#4229a8)}
.btn.blue{background:linear-gradient(#9fdcff,#3d9bff 45%,#1f55c9)}
.btn[disabled]{filter:grayscale(.85) brightness(.75);pointer-events:none}
.btn img{vertical-align:-4px}

/* HUD pills */
.hud{display:flex;gap:10px;align-items:center;padding-left:8px}
.pill{position:relative;flex:1;min-width:0;display:flex;align-items:center;height:34px;border-radius:12px;background:linear-gradient(#2c2770,#17143f);border:3px solid var(--outline);box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.4)}
.pill>img{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:40px;height:40px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.pill b{flex:1;min-width:0;text-align:center;font-family:var(--font-d);font-weight:400;font-size:17px;padding-left:18px;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.pill small{font-size:11px;font-weight:800;color:var(--muted);padding-right:6px;white-space:nowrap}
.plus{width:24px;height:24px;margin-right:3px;border-radius:8px;background:linear-gradient(#8bff9f,var(--go-d));border:2px solid var(--outline);font-family:var(--font-d);font-size:18px;line-height:18px}

/* home */
#home{gap:8px}
.side{position:absolute;top:62px;display:flex;flex-direction:column;gap:12px;z-index:2}
.side.l{left:12px}.side.r{right:12px}
.sbtn{position:relative;width:64px;display:flex;flex-direction:column;align-items:center}
.sbtn .orb{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#9d86ff,#4a2fc0 70%);border:3px solid var(--outline);box-shadow:0 3px 0 var(--outline),inset 0 3px 0 rgba(255,255,255,.3)}
.sbtn .orb img{width:46px;height:46px}
.sbtn.hot .orb{background:radial-gradient(circle at 35% 30%,#ffb0a0,#e8452f 70%)}
.sbtn.gold .orb{background:radial-gradient(circle at 35% 30%,#fff1a8,#e5a01c 70%)}
.sbtn small{margin-top:-10px;padding:0 6px;border-radius:8px;background:var(--navy);border:2px solid var(--outline);font-family:var(--font-d);font-size:12px;white-space:nowrap}
.badge{position:absolute;top:-4px;right:-2px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:linear-gradient(#ff7a9c,#e01e4f);border:2px solid #fff;font-family:var(--font-d);font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.flex1{flex:1}
.roomtag{align-self:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 18px 8px;border-radius:16px;background:rgba(14,8,40,.72);border:3px solid var(--outline);box-shadow:0 3px 0 rgba(0,0,0,.4);min-width:220px}
.roomtag h2{font-size:20px;color:var(--gold)}
.roomtag .bar{width:100%}
.bar{height:12px;border-radius:7px;background:#0b0620;border:2px solid var(--outline);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#b6ff8c,#3fe06e 60%,#1fa64a);border-radius:5px}
.homerow{display:flex;gap:10px;align-items:stretch}
.lvl{flex:1.25;font-size:30px;padding:14px 8px 17px}
.lvl small{display:block;font-size:12px;-webkit-text-stroke:2px rgba(26,11,51,.8);opacity:.95;margin-top:-2px}
.fixcard{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 8px 9px;border-radius:18px;border:3px solid var(--outline);
  background:linear-gradient(#fff09a,var(--gold) 45%,var(--gold-d));box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 4px 0 var(--outline);color:#3d1d00}
.fixcard .nm{font-weight:800;font-size:13px;line-height:1.1;text-align:center}
.fixcard .cost{display:flex;align-items:center;gap:2px;font-family:var(--font-d);font-size:20px;color:#fff;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.fixcard .cost img{width:26px;height:26px}
.fixcard.can{animation:nudge 1.6s infinite}
@keyframes nudge{0%,80%,100%{transform:none}85%{transform:rotate(-3deg) scale(1.04)}90%{transform:rotate(3deg) scale(1.04)}}
.tabbar{display:flex;gap:4px;background:linear-gradient(#2c2770,#17143f);border:3px solid var(--outline);border-radius:18px;padding:4px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:2px 0 3px;border-radius:13px;font-family:var(--font-d);font-size:12px;color:var(--muted)}
.tab img{width:34px;height:34px}
.tab.on{background:linear-gradient(#6a4fe0,#3d2a9c);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}

/* game HUD */
.ghead{display:flex;align-items:center;gap:6px}
.avatar{width:66px;height:66px;flex:none;border-radius:50%;border:3px solid var(--outline);background:#2c2f8f;box-shadow:0 3px 0 rgba(0,0,0,.45);overflow:hidden;z-index:1}
.avatar img{width:100%;height:100%;display:block}
.gpanel{flex:1;min-width:0;position:relative;display:flex;align-items:center;gap:6px;margin-left:-18px;padding:6px 8px 6px 20px;border-radius:16px;background:linear-gradient(#3b44c4,#252a8a);border:3px solid var(--outline);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.2)}
.lvltag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:0 10px;border-radius:9px;background:var(--navy);border:2px solid var(--outline);font-family:var(--font-d);font-size:12px;white-space:nowrap}
.goals{flex:1;display:flex;justify-content:center;gap:4px;background:var(--panel);border:2px solid var(--outline);border-radius:12px;padding:3px 4px;min-height:48px;align-items:center}
.goal{position:relative;width:46px;display:flex;flex-direction:column;align-items:center}
.goal img{width:40px;height:40px}
.goal b{position:absolute;right:-1px;bottom:-5px;font-family:var(--font-d);font-weight:400;font-size:15px;color:#fff;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.goal.done b{color:#7dff8a}
.goal.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.3)}}
.moves{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:60px;line-height:1;padding:4px 0 6px;border-radius:12px;background:var(--navy);border:2px solid var(--outline)}
.moves small{font-family:var(--font-d);font-size:12px;color:#c9d2ff}
.moves b{font-family:var(--font-d);font-weight:400;font-size:32px;-webkit-text-stroke:4px var(--outline);paint-order:stroke fill}
.moves.low b{color:#ff8aa8;animation:bump .6s infinite}
.boardwrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#bc,#evc{display:block;touch-action:none}
#banner{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-family:var(--font-d);font-size:52px;white-space:nowrap;color:#fff3a0;
  -webkit-text-stroke:8px var(--outline);paint-order:stroke fill;text-shadow:0 6px 0 var(--outline),0 0 30px rgba(255,200,0,.7);pointer-events:none;animation:pop .5s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}70%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}100%{transform:translate(-50%,-50%) scale(1)}}
.tools{display:flex;gap:7px;justify-content:center;align-items:center}
.tool{position:relative;width:60px;height:60px;border-radius:16px;border:3px solid var(--outline);background:linear-gradient(#fff09a,#ffc83d 45%,#d9820c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 0 var(--outline);display:grid;place-items:center}
.tool img{width:46px;height:46px}
.tool b{position:absolute;right:-7px;bottom:-7px;min-width:24px;height:24px;border-radius:12px;background:linear-gradient(#ff7a9c,#e01e4f);border:2px solid #fff;font-size:13px;font-family:var(--font-d);font-weight:400;display:grid;place-items:center;padding:0 4px}
.tool.on{transform:translateY(-6px) scale(1.06);box-shadow:0 0 0 3px #fff,0 0 22px var(--gold),0 4px 0 var(--outline)}
.gear{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a6c8ff,#3d6bd6 70%);border:3px solid var(--outline);box-shadow:0 3px 0 var(--outline);display:grid;place-items:center}
.gear img{width:34px;height:34px}
.toolhint{text-align:center;font-family:var(--font-d);font-size:15px;color:#fff3a0;min-height:20px;margin:-4px 0 -2px;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}

/* event */
.evhead{display:flex;align-items:center;gap:8px}
.evhead h2{flex:1;text-align:center;font-size:24px;padding:4px 6px 6px;border-radius:14px;background:linear-gradient(#ff5a45,#b3192c);border:3px solid var(--outline);box-shadow:inset 0 0 0 3px #ffb35a,0 3px 0 var(--outline);-webkit-text-stroke:5px var(--outline);paint-order:stroke fill}
.iconbtn{width:42px;height:42px;border-radius:50%;font-family:var(--font-d);font-size:20px;background:radial-gradient(circle at 35% 30%,#a6d4ff,#2a6bd6 70%);border:3px solid var(--outline);box-shadow:0 3px 0 var(--outline),inset 0 0 0 2px rgba(255,255,255,.6);-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.iconbtn.x{background:radial-gradient(circle at 35% 30%,#ffb0a0,#d6283a 70%)}
.evwrap{flex:1;display:flex;justify-content:center;align-items:flex-start;min-height:0}
.evfoot{display:flex;gap:10px;align-items:center;justify-content:center}
.gen{position:relative;display:flex;align-items:center;gap:6px;padding:4px 18px 6px 6px;border-radius:22px;background:linear-gradient(#a38bff,#6a4fe0 45%,#4229a8);border:3px solid var(--outline);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 0 var(--outline);font-family:var(--font-d);font-size:18px;-webkit-text-stroke:4px var(--outline);paint-order:stroke fill}
.gen img{width:56px;height:56px}
.gen:active{transform:translateY(3px)}
.gen .badge{top:-10px;right:-8px}
.gen.empty{filter:grayscale(.7)}

/* modal */
#modal{position:absolute;inset:0;background:rgba(8,3,24,.72);display:grid;place-items:center;padding:16px;z-index:20}
.mbox{position:relative;width:100%;max-width:400px;max-height:calc(100% - 20px);overflow:auto;border-radius:26px;background:linear-gradient(#5a46d6,#3a2a9c 30%,#2a1d78);border:3px solid var(--outline);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 8px 0 var(--outline);animation:mpop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes mpop{from{transform:scale(.7);opacity:0}}
.mtitle{position:relative;margin:10px 12px 0;padding:8px 44px 10px;border-radius:16px;background:linear-gradient(#ff7a5a,#d62d3c);border:3px solid var(--outline);box-shadow:inset 0 3px 0 rgba(255,255,255,.3);text-align:center}
.mtitle h2{font-size:26px;-webkit-text-stroke:5px var(--outline);paint-order:stroke fill}
.mclose{position:absolute;right:-8px;top:-10px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb0a0,#d6283a 70%);border:3px solid var(--outline);font-family:var(--font-d);font-size:17px;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill;box-shadow:0 3px 0 var(--outline)}
.mbody{padding:14px 16px 6px;display:flex;flex-direction:column;gap:12px}
.mbody p{margin:0;line-height:1.35;color:#efe9ff;text-align:center;font-weight:700}
.inset{background:rgba(10,4,40,.45);border:2px solid rgba(0,0,0,.35);border-radius:16px;padding:10px}
.mbtns{display:flex;gap:10px;padding:8px 16px 18px;justify-content:center;flex-wrap:wrap}
.mbtns .btn{flex:1;min-width:120px}
.rewards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.rw{position:relative;display:flex;flex-direction:column;align-items:center;width:70px;padding:6px 2px 4px;border-radius:16px;background:radial-gradient(circle at 50% 40%,rgba(255,220,120,.35),rgba(10,4,40,.5) 70%);border:2px solid rgba(0,0,0,.35)}
.rw img{width:50px;height:50px}
.rw b{font-family:var(--font-d);font-weight:400;font-size:16px;margin-top:-6px;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.boostpick{display:flex;gap:10px;justify-content:center}
.bp{position:relative;width:80px;padding:6px 0 6px;border-radius:18px;background:linear-gradient(#ffe48a,#f0a92a);border:3px solid var(--outline);box-shadow:0 3px 0 var(--outline);display:flex;flex-direction:column;align-items:center;font-family:var(--font-d);font-size:12px;color:#fff;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.bp img{width:50px;height:50px}
.bp b{position:absolute;right:-8px;top:-8px;min-width:24px;height:24px;border-radius:12px;background:linear-gradient(#ff7a9c,#e01e4f);border:2px solid #fff;font-weight:400;font-size:13px;display:grid;place-items:center;padding:0 4px;-webkit-text-stroke:0}
.bp.on{background:linear-gradient(#b6ff8c,#3fe06e);transform:translateY(-3px)}
.bp.on b{background:linear-gradient(#8bff9f,#13923d)}
.glist{display:flex;justify-content:center;gap:10px}
.shop{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:16px;background:rgba(10,4,40,.45);border:2px solid rgba(0,0,0,.35)}
.srow img{width:46px;height:46px}
.srow div{flex:1;min-width:0;line-height:1.15}
.srow div b{display:block;font-family:var(--font-d);font-weight:400;font-size:16px}
.srow div small{color:var(--muted);font-size:12px;font-weight:700}
.srow .btn{font-size:15px;padding:5px 10px 8px;display:flex;align-items:center;gap:3px}
.srow .btn img{width:20px;height:20px}
.note{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.guide{display:grid;grid-template-columns:48px 1fr;gap:6px 10px;align-items:center}
.guide img{width:48px;height:48px}
.guide div{font-size:13px;line-height:1.25;font-weight:600}
.guide div b{display:block;font-family:var(--font-d);font-weight:400;font-size:16px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(10,4,40,.45);font-family:var(--font-d);font-size:17px}
.toggle button{width:72px;padding:4px 0 7px;font-size:15px}
.tasklist{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;background:rgba(10,4,40,.45);border:2px solid rgba(0,0,0,.35);text-align:left}
.task span{flex:1;min-width:0;font-family:var(--font-d);font-size:16px}
.task .btn{font-size:15px;padding:4px 10px 7px;display:flex;gap:2px;align-items:center}
.task .btn img{width:20px;height:20px}
.task.done{opacity:.6}
.task.done em{font-style:normal;font-family:var(--font-d);color:#7dff8a}
#toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);padding:8px 16px;border-radius:14px;background:linear-gradient(#2c2770,#17143f);border:3px solid var(--outline);box-shadow:0 3px 0 rgba(0,0,0,.4);font-family:var(--font-d);font-size:15px;text-align:center;animation:mpop .2s;pointer-events:none}
/* round 3: streak, rating, cards, daily */
.lvl{position:relative}
.lvl.hot{background:linear-gradient(#ffb0a0,#ff5a45 45%,#b3192c)}
.stk{position:absolute;left:-10px;top:-14px;display:flex;align-items:center;gap:0;padding:0 8px 0 2px;height:30px;border-radius:15px;background:linear-gradient(#ffb35a,#e8452f);border:3px solid var(--outline);font-size:16px;-webkit-text-stroke:3px var(--outline)}
.stk img{width:28px;height:28px;margin-top:-6px}
.hardtag{align-self:center;padding:2px 14px 4px;border-radius:12px;background:linear-gradient(#ff7a5a,#b3192c);border:3px solid var(--outline);font-family:var(--font-d);font-size:16px;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.streakrow{display:flex;gap:6px;justify-content:center;align-items:center}
.streakrow .seg{position:relative;width:62px;padding:4px 0 2px;border-radius:12px;background:rgba(10,4,40,.5);border:2px solid rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;font-family:var(--font-d);font-size:11px;color:var(--muted)}
.streakrow .seg img{width:34px;height:34px;filter:grayscale(1) brightness(.5)}
.streakrow .seg.on{background:linear-gradient(#ffb35a,#e8452f);color:#fff;border-color:var(--outline)}
.streakrow .seg.on img{filter:none}
.rate{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-top:-4px}
.rate img{width:64px;height:64px;filter:grayscale(1) brightness(.45)}
.rate img:nth-child(2){width:84px;height:84px}
.rate img.on{filter:none;animation:starpop .45s both}
@keyframes starpop{from{transform:scale(2.4) rotate(-40deg);opacity:0}}
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;perspective:600px}
.card{position:relative;width:86px}
.card img{width:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.card.flip{animation:flip .55s both}
@keyframes flip{from{transform:rotateY(100deg) scale(.5);opacity:0}}
.card .new,.card .cnt{position:absolute;top:-7px;right:-7px;padding:0 6px;border-radius:9px;background:linear-gradient(#ff7a9c,#e01e4f);border:2px solid #fff;font-family:var(--font-d);font-size:12px}
.card .cnt{background:var(--navy)}
.atabs{display:flex;gap:6px}
.atabs .btn{flex:1;font-size:13px;padding:5px 4px 8px;-webkit-text-stroke:3px rgba(26,11,51,.85)}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.agrid .card{width:100%}
.albhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-d);font-size:15px;color:var(--gold)}
.tokpill{display:flex;align-items:center;gap:4px;padding:2px 10px 2px 4px;border-radius:14px;background:#120b2e;border:2px solid var(--outline);color:#fff}
.buycard{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:2px;padding:2px 8px 3px 4px;border-radius:12px;background:linear-gradient(#a38bff,#4229a8);border:2px solid var(--outline);font-family:var(--font-d);font-size:13px;color:#fff;white-space:nowrap}
.buycard.ok{background:linear-gradient(#fff09a,#d9820c);color:#3d1d00;animation:nudge 1.8s infinite}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avpick{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 6px;border-radius:16px;background:rgba(10,4,40,.5);border:3px solid rgba(0,0,0,.35)}
.avpick img{width:100%;max-width:64px;border-radius:50%;border:3px solid #1a0b33}
.avpick b{font-family:var(--font-d);font-weight:400;font-size:13px}
.avpick small{font-size:10px;font-weight:800;color:var(--gold)}
.avpick.on{border-color:var(--go);background:rgba(56,214,108,.22)}
.avpick em{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--go);border:2px solid #fff;font-style:normal;font-family:var(--font-d);display:grid;place-items:center}
.avpick.locked img{filter:grayscale(1) brightness(.45)}
.daily{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dday{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 2px 2px;border-radius:14px;background:rgba(10,4,40,.5);border:2px solid rgba(0,0,0,.4)}
.dday img{width:42px;height:42px}
.dday small{font-family:var(--font-d);font-size:12px}
.dday b{font-family:var(--font-d);font-weight:400;font-size:14px;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.dday.big{grid-column:span 2;background:radial-gradient(circle,rgba(255,200,61,.35),rgba(10,4,40,.5))}
.dday.now{background:linear-gradient(#fff09a,#d9820c);border-color:#fff;animation:nudge 1.6s infinite}
.dday.got{opacity:.4}
.dday.got::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:30px;color:#7dff8a;-webkit-text-stroke:4px var(--outline);paint-order:stroke fill}
/* story cutscenes */
#story{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(rgba(8,3,24,.15),rgba(8,3,24,.55) 40%,rgba(8,3,24,.92) 75%);cursor:pointer}
.st-stage{position:relative;height:min(46vh,340px);margin-bottom:-30px;pointer-events:none}
.st-por{position:absolute;bottom:0;height:100%;max-width:62%;object-fit:contain;object-position:bottom;transition:transform .3s,filter .3s;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.st-por.l{left:-6px;transform-origin:bottom left}.st-por.r{right:-6px;transform-origin:bottom right}
.st-por.dim{filter:brightness(.4) saturate(.5);transform:scale(.9)}
.st-por.in{animation:porin .35s both}
.st-por.r.in{animation-name:porinr}
@keyframes porin{from{transform:translateX(-60px);opacity:0}}
@keyframes porinr{from{transform:translateX(60px);opacity:0}}
.st-box{position:relative;margin:0 12px 20px;padding:24px 18px 22px;border-radius:22px;background:linear-gradient(#4a38c4,#2a1d86 40%,#1d145e);border:3px solid var(--outline);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 6px 0 var(--outline);min-height:112px}
.st-name{position:absolute;top:-19px;left:16px;padding:2px 14px 4px;border-radius:12px;font-family:var(--font-d);font-size:18px;border:3px solid var(--outline);-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.st-name.nova{background:linear-gradient(#9df4ff,#2a9ad6)}.st-name.dex{background:linear-gradient(#ffe48a,#e08a1c);left:auto;right:16px}.st-name.bandit{background:linear-gradient(#ff9ac0,#d6285e);left:auto;right:16px}
.st-box p{margin:0;font-size:18px;font-weight:700;line-height:1.35;min-height:48px}
.st-next{position:absolute;right:16px;bottom:6px;font-family:var(--font-d);color:var(--gold);animation:bump .8s infinite}
.st-skip{position:absolute;top:12px;right:12px;z-index:2;padding:4px 14px 7px;font-size:15px}
.st-title{position:absolute;left:16px;right:16px;top:24%;text-align:center;font-family:var(--font-d);font-size:46px;line-height:1;color:#fff3a0;-webkit-text-stroke:8px var(--outline);paint-order:stroke fill;text-shadow:0 6px 0 var(--outline);animation:titlein .6s both;pointer-events:none}
@keyframes titlein{0%{transform:scale(.3) rotate(-8deg);opacity:0}70%{transform:scale(1.12) rotate(2deg)}100%{transform:none}}
#story.titling .st-box,#story.titling .st-stage{visibility:hidden}
.st-title small{display:block;font-size:22px;color:#fff;-webkit-text-stroke:5px var(--outline);margin-bottom:6px}
/* tour map */
#map{pointer-events:none}
#map .evhead,#map .btn{pointer-events:auto}
#map .evhead h2{font-size:19px;background:linear-gradient(#5a46d6,#2c2f8f);box-shadow:inset 0 0 0 3px rgba(255,255,255,.2),0 3px 0 var(--outline)}
#map .evhead h2 small{display:block;font-size:12px;color:var(--gold);-webkit-text-stroke:3px var(--outline)}
.mapstars{display:flex;align-items:center;gap:2px;padding:0 10px 0 4px;height:40px;border-radius:20px;background:linear-gradient(#2c2770,#17143f);border:3px solid var(--outline);font-family:var(--font-d);font-size:16px;pointer-events:auto}
.mapstars img{width:30px;height:30px}
/* rhythm drop + boss */
.tool{width:54px;height:54px}.tool img{width:42px;height:42px}.gear{width:42px;height:42px}
.dropbtn{position:relative;width:62px;height:62px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a46d6,#1d145e 70%);border:3px solid var(--outline);box-shadow:0 3px 0 var(--outline),0 0 calc(var(--p,0)*18px) rgba(255,79,139,.8);display:grid;place-items:center;transform:scale(calc(1 + var(--p,0)*.1))}
.dropbtn canvas{position:absolute;left:-4px;top:-4px;width:64px;height:64px;pointer-events:none}
.dropbtn span{position:relative;font-family:var(--font-d);font-size:13px;color:#9df4ff;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.dropbtn.full{background:radial-gradient(circle at 35% 30%,#fff09a,#ff8a1f 70%);animation:dropglow .45s infinite alternate}
.dropbtn.full span{color:#fff;font-size:16px}
@keyframes dropglow{to{box-shadow:0 3px 0 var(--outline),0 0 26px #ffc83d,0 0 6px #fff}}
.bossbar{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;margin-top:-2px;border-radius:16px;background:linear-gradient(#6a1a40,#2a0a1e);border:3px solid var(--outline);box-shadow:0 3px 0 rgba(0,0,0,.45)}
.bossbar img{width:48px;height:48px;margin:-10px 0 -6px}
.bbinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bbinfo b{font-family:var(--font-d);font-weight:400;font-size:15px;line-height:1;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.bbhp i{background:linear-gradient(#ffb3c6,#e01e4f 60%,#a8123a);transition:width .2s}
.bbatk{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:52px}
.bbatk small{font-size:10px;font-family:var(--font-d);color:#ffb3c6}
.bbatk b{font-family:var(--font-d);font-weight:400;font-size:24px;-webkit-text-stroke:4px var(--outline);paint-order:stroke fill}
.bbatk.soon b{color:#ff5a6e;animation:bump .6s infinite}
.bossbar.hit img{animation:bump .25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* studio restore panel + style picker */
#home>*{transition:opacity .3s}
#home.cine>*{opacity:0;pointer-events:none}
#fixPanel{position:absolute;inset:0;z-index:19;display:grid;place-items:center;padding:16px;background:rgba(8,3,24,.6);animation:fpfade .2s}
@keyframes fpfade{from{opacity:0}}
.fp{position:relative;width:100%;max-width:380px;padding-bottom:14px;border-radius:26px;background:linear-gradient(#5a46d6,#3a2a9c 30%,#2a1d78);border:3px solid var(--outline);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 8px 0 var(--outline);animation:mpop .28s cubic-bezier(.3,1.5,.5,1)}
.fprog{display:flex;align-items:center;gap:8px;margin:14px 14px 4px;padding:8px 10px 10px 14px;border-radius:16px;background:linear-gradient(#fff6c4,#ffd56b);border:3px solid var(--outline);box-shadow:inset 0 3px 0 rgba(255,255,255,.5)}
.fprog .fpl{flex:1;text-align:center}
.fprog b{display:block;font-family:var(--font-d);font-weight:400;font-size:17px;color:#4a2400;margin-bottom:4px}
.pbar{position:relative;height:18px;border-radius:10px;background:#2a1d50;border:2px solid var(--outline);overflow:hidden;display:grid;place-items:center}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#c6ff9c,#2fb04f);border-radius:8px;transition:width .9s cubic-bezier(.3,1,.4,1)}
.pbar span{position:relative;font-family:var(--font-d);font-size:13px;color:#fff;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill;line-height:1}
.fprog img{width:58px;height:58px;margin:-10px -4px -8px 0}
.frow{display:flex;align-items:center;gap:10px;margin:10px 14px 0;padding:5px 6px 5px 8px;min-height:58px;max-height:90px;border-radius:16px;background:linear-gradient(#fffaf0,#efe0c0);border:3px solid var(--outline);box-shadow:0 4px 0 rgba(0,0,0,.35);color:#2a1406;overflow:hidden}
.frow canvas{width:46px;height:46px;flex:none}
.frow .nm{flex:1;font-weight:800;font-size:15px;line-height:1.15}
.frow .buy{flex:none;display:flex;align-items:center;gap:2px;height:44px;padding:0 12px 0 6px;border-radius:12px;border:3px solid var(--outline);background:linear-gradient(#8bff9f,var(--go) 45%,var(--go-d));box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 3px 0 var(--outline);font-family:var(--font-d);font-size:22px;color:#fff;-webkit-text-stroke:4px var(--outline);paint-order:stroke fill}
.frow .buy img{width:28px;height:28px}
.frow .buy.dim{filter:grayscale(.85) brightness(.85)}
.frow .buy:active{transform:translateY(2px)}
.frow .chk{flex:none;width:52px;text-align:center;font-family:var(--font-d);font-size:36px;color:#3fe06e;-webkit-text-stroke:5px var(--outline);paint-order:stroke fill;animation:chkpop .45s .15s cubic-bezier(.3,1.8,.5,1) both}
.frow.gone{animation:rowout .35s 1.1s forwards}
.frow.new{animation:rowin .4s 1.35s both}
@keyframes rowout{to{opacity:0;max-height:0;min-height:0;margin-top:0;padding-top:0;padding-bottom:0;border-width:0}}
@keyframes rowin{from{transform:translateY(24px);opacity:0}}
@keyframes chkpop{from{transform:scale(0)}}
.fnote{margin:12px 12px 0;text-align:center;font-weight:700;color:#cfc6ff;font-size:13px}
#stylePick{position:absolute;inset:0;z-index:19;display:flex;flex-direction:column;align-items:center;pointer-events:none;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
#stylePick>*{pointer-events:auto}
#stylePick .flex1{pointer-events:none}
#stylePick .sign{position:relative;margin-top:calc(46px + env(safe-area-inset-top));padding:8px 30px 10px;border-radius:12px;background:linear-gradient(#ff7a5a,#d62d3c);border:3px solid var(--outline);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 5px 0 var(--outline);animation:signdrop .55s cubic-bezier(.3,1.6,.5,1) both}
#stylePick .sign i{position:absolute;top:-48px;width:3px;height:46px;background:linear-gradient(#999,#ddd)}
#stylePick .sign i:first-child{left:22px}#stylePick .sign i:nth-child(2){right:22px}
#stylePick .sign h3{margin:0;font-family:var(--font-d);font-weight:400;font-size:26px;color:#fff;-webkit-text-stroke:5px var(--outline);paint-order:stroke fill;white-space:nowrap}
@keyframes signdrop{from{transform:translateY(-160px)}}
.sphint{margin:0 0 8px;font-family:var(--font-d);font-size:18px;color:#fff;-webkit-text-stroke:4px var(--outline);paint-order:stroke fill;animation:rowin .4s both}
.sws{display:flex;gap:14px;animation:rowin .4s .08s both}
.sw{position:relative;width:88px;height:88px;padding:4px;border-radius:16px;background:linear-gradient(#5a46d6,#2a1d78);border:3px solid var(--outline);box-shadow:0 4px 0 var(--outline)}
.sw canvas{width:100%;height:100%;display:block}
.sw.on{border-color:#7dff8a;box-shadow:0 0 0 3px #2fb04f,0 4px 0 var(--outline)}
.sw em{display:none;position:absolute;right:-9px;bottom:-9px;width:28px;height:28px;border-radius:50%;background:#2fb04f;border:3px solid var(--outline);font-style:normal;color:#fff;font-weight:900;font-size:15px;place-items:center}
.sw.on em{display:grid}
.spok{margin-top:18px;width:150px;font-size:30px;animation:rowin .4s .16s both}

/* pop-up event */
.popfoot{gap:12px}
.pope{display:flex;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:16px;background:rgba(10,4,40,.6);border:3px solid var(--outline)}
.pope img{width:34px;height:34px}.pope b{font-family:var(--font-d);font-weight:400;font-size:22px;-webkit-text-stroke:4px var(--outline);paint-order:stroke fill}.pope small{font-size:12px;font-weight:700;color:#cfc6ff}
#popTitle small{display:block;font-size:12px;-webkit-text-stroke:3px var(--outline);color:#ffd56b;margin-top:-2px}
#popc{touch-action:none}
.pcoll{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pcoll div{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:12px;background:rgba(10,4,40,.45);border:2px solid rgba(0,0,0,.35)}
.pcoll img{width:52px;height:52px;filter:brightness(0) opacity(.35)}.pcoll .got img{filter:none}
.pcoll small{font-size:11px;font-weight:800;text-align:center;line-height:1.1;color:#efe9ff}

/* retention loop */
.playwrap{position:relative;flex:1.25;display:flex}.playwrap .lvl{flex:1}
.tcchip{position:absolute;left:8px;top:-13px;display:flex;align-items:center;gap:2px;padding:1px 8px 1px 2px;border-radius:10px;background:linear-gradient(#5a46d6,#2a1d78);border:2px solid var(--outline);font-family:var(--font-d);font-size:13px;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill;pointer-events:none}
.tcchip img{width:24px;height:24px;margin:-6px 0}
.pill.inf b{color:#ff8ab2}.pill.inf small{color:#ff8ab2}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:rgba(10,4,40,.45);border:2px solid rgba(0,0,0,.35)}
.qrow>img{width:44px;height:44px;flex:none}.qrow.claimed{opacity:.55}
.qmid{flex:1;min-width:0}.qmid b{display:block;font-size:14px;margin-bottom:4px}
.qbar{position:relative;height:16px;border-radius:9px;background:#120b2e;border:2px solid var(--outline);overflow:hidden;display:grid;place-items:center}
.qbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#c6ff9c,#2fb04f);border-radius:7px}
.qbar span{position:relative;font-family:var(--font-d);font-size:11px;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.qclaim{flex:none;min-width:74px;padding:8px 10px;font-size:16px}.qclaim img{width:28px;height:28px}
.qrow em{font-style:normal;font-size:28px;color:#3fe06e;font-family:var(--font-d);-webkit-text-stroke:4px var(--outline);paint-order:stroke fill;width:74px;text-align:center}
.qbonus{display:flex;align-items:center;gap:10px;margin-top:4px;padding:8px 10px;border-radius:14px;background:rgba(255,200,61,.12);border:2px dashed rgba(255,200,61,.5);font-size:13px}
.qbonus.ready{background:linear-gradient(#ffe48a,#ffb020);color:#3a1a00;border:3px solid var(--outline)}
.qbonus img{width:50px;height:50px;flex:none}.qbonus div{flex:1}.qbonus b{display:block;font-size:15px}
.rlanes{display:flex;flex-direction:column;gap:6px}
.rlane{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;background:rgba(10,4,40,.45);border:2px solid rgba(0,0,0,.35)}
.rlane.me{background:linear-gradient(#5a46d6,#3a2a9c);border-color:#ffd56b}
.rpos{font-family:var(--font-d);font-weight:400;font-size:20px;width:18px;text-align:center;-webkit-text-stroke:3px var(--outline);paint-order:stroke fill}
.rlane>img{width:40px;height:40px;border-radius:50%;flex:none}
.rmid{flex:1;min-width:0}.rmid span{display:block;font-weight:800;font-size:13px;margin-bottom:3px}
.rtrack{display:flex;gap:4px}.rtrack i{flex:1;height:10px;border-radius:5px;background:#120b2e;border:1.5px solid var(--outline)}.rtrack i.on{background:linear-gradient(#fff09a,#ff9a1f)}
.rflag{width:30px!important;height:30px!important;border-radius:0!important}
.rushline{display:flex;align-items:center;justify-content:center;gap:6px;margin:0;font-weight:800;font-size:13px;color:#ffd56b}.rushline img{width:26px;height:26px}
.tcrow{display:flex;align-items:center;gap:8px}.tcrow img{width:40px;height:40px}.tcrow .qbar{flex:1;height:18px}
</style>


</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>

  <!-- STUDIO (home) -->
  <section id="home" class="screen">
    <header class="hud">
      <div class="pill"><img data-ic="coin" alt=""><b id="hCoins" class="num">0</b><button class="plus" data-act="shop" aria-label="Get coins">+</button></div>
      <div class="pill"><img data-ic="heart" alt=""><b id="hLives" class="num">5</b><small id="hLivesT">Full</small></div>
      <div class="pill"><img data-ic="star" alt=""><b id="hStars" class="num">0</b></div>
    </header>
    <div class="side l">
      <button class="sbtn hot" id="evBtn"><span class="orb"><img data-ic="bandit" alt=""></span><small id="evBtnTxt">Bandit</small><span class="badge num" id="evCardEn">0</span></button>
      <button class="sbtn" id="albBtn"><span class="orb"><img data-ic="album" alt=""></span><small>Album</small><span class="badge num" id="albBadge" hidden>0</span></button>
      <button class="sbtn" id="popBtn"><span class="orb"><img id="popIc" alt=""></span><small id="popBT">Pop-Up</small><span class="badge" id="popBadge">NEW</span></button>
      <button class="sbtn gold" id="dayBtn"><span class="orb"><img data-ic="cal" alt=""></span><small>Daily</small><span class="badge" id="dayBadge" hidden>!</span></button>
    </div>
    <div class="side r">
      <button class="sbtn gold" id="fixBtn"><span class="orb"><img data-ic="clip" alt=""></span><small>Fixes</small></button>
      <button class="sbtn hot" id="avBtn"><span class="orb"><img data-ic="dj" alt="" style="width:52px;height:52px;border-radius:50%"></span><small>My DJ</small></button>
      <button class="sbtn gold" id="qBtn"><span class="orb"><img data-ic="setl" alt=""></span><small>Setlist</small><span class="badge num" id="qBadge" hidden>0</span></button>
      <button class="sbtn hot" id="rushBtn"><span class="orb"><img data-ic="rush" alt=""></span><small id="rushT">Rush</small><span class="badge" id="rushBadge" hidden>!</span></button>
    </div>
    <div class="flex1"></div>
    <div class="roomtag"><h2 class="ts3" id="roomName">The Basement</h2><div class="bar"><i id="roomBar" style="width:0%"></i></div></div>
    <div class="homerow">
      <div class="playwrap"><button class="btn go lvl" id="playBtn">Level 1</button><span class="tcchip" id="tcChip"></span></div>
      <button class="fixcard" id="fixCard"><span class="nm" id="fixName">Patch the walls</span><span class="cost"><img data-ic="star" alt=""><span id="fixCost">1</span></span></button>
    </div>
    <nav class="tabbar">
      <button class="tab" data-act="shop"><img data-ic="gift" alt="">Shop</button>
      <button class="tab on"><img data-ic="pad" alt="">Studio</button>
      <button class="tab" id="tabMap"><img data-ic="mapi" alt="">Tour</button>
      <button class="tab" id="tabEv"><img data-ic="bandit" alt="">Bandit</button>
    </nav>
  </section>

  <!-- GIG (match-3) -->
  <section id="game" class="screen" hidden>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const P2=Math.PI*2;
let rand=Math.random;
const ri=n=>Math.floor(rand()*n);
const rnd=n=>Math.floor(Math.random()*n);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DPR=Math.min(2,window.devicePixelRatio||1);
const FONT='"Lilita One","Arial Rounded MT Bold",Impact,sans-serif';

/* ================= SAVE ================= */
const LIFE_MS=20*60*1000, MAX_LIVES=5;
const DEF={level:1,coins:1500,stars:3,lives:5,livesTs:0,
  boost:{sub:2,fader:2,plat:1,stick:3,sweep:2,drop:2,remix:2},
  studio:{room:0,done:[]},ev:null,music:true,sfx:true,seenGuide:false,
  streak:0,album:{},albumDone:{},newCards:0,daily:{day:0,last:''},rating:{},story:{}};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem('beatmatch_v2')||'null');if(j){const d=JSON.parse(JSON.stringify(DEF));return Object.assign(d,j,{boost:Object.assign(d.boost,j.boost||{}),studio:Object.assign(d.studio,j.studio||{})});}}catch(e){}return JSON.parse(JSON.stringify(DEF));}
function save(){try{localStorage.setItem('beatmatch_v2',JSON.stringify(S));}catch(e){}}
function tickLives(){
  if(S.lives>=MAX_LIVES){S.lives=MAX_LIVES;S.livesTs=0;return;}
  if(!S.livesTs)S.livesTs=Date.now();
  const n=Math.floor((Date.now()-S.livesTs)/LIFE_MS);
  if(n>0){S.lives=Math.min(MAX_LIVES,S.lives+n);S.livesTs=S.lives>=MAX_LIVES?0:S.livesTs+n*LIFE_MS;save();}
}
function lifeTimer(){if(S.lives>=MAX_LIVES)return'Full';const ms=Math.max(0,LIFE_MS-(Date.now()-S.livesTs));const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return m+':'+String(s).padStart(2,'0');}

/* ================= AUDIO (C minor pentatonic) ================= */
let AC=null,master,sfxG,musG,noiseBuf;
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);
    sfxG=AC.createGain();sfxG.connect(master);musG=AC.createGain();musG.gain.value=.32;musG.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();return AC;
}
const PENT=[0,3,5,7,10];
const nf=(i,base=261.63)=>{const o=Math.floor(i/5),d=PENT[((i%5)+5)%5];return base*Math.pow(2,o+d/12);};
function tone(f,dur=.18,type='triangle',vol=.2,when=0,dest){if(!AC||(!S.sfx&&!dest))return;const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,ftype,ff,when=0,dest){if(!AC)return;const t=AC.currentTime+when;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ftype;f.frequency.value=ff;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t);s.stop(t+dur+.02);}
const sfx={
  match(step){if(!S.sfx||!AC)return;const i=5+Math.min(step,9);tone(nf(i),.28,'triangle',.2);tone(nf(i+2),.2,'sine',.07,.03);},
  swap(){if(S.sfx&&AC)tone(880,.05,'sine',.06);},
  bad(){if(S.sfx&&AC){tone(196,.1,'square',.06);tone(156,.14,'square',.06,.08);}},
  boom(){buzz(25);if(!S.sfx||!AC)return;const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.35);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.45);noise(.35,.35,'lowpass',1800);},
  sweep(){if(!S.sfx||!AC)return;const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(2400,t+.25);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.32);noise(.25,.15,'highpass',3000);},
  zap(){if(!S.sfx||!AC)return;for(let i=0;i<6;i++)tone(nf(10+i),.12,'square',.04,i*.04);},
  crack(){if(S.sfx&&AC)noise(.08,.25,'bandpass',2500);},
  pop(){if(S.sfx&&AC)tone(nf(12),.12,'sine',.12);},
  merge(t){if(S.sfx&&AC){tone(nf(5+t*2),.2,'triangle',.18);tone(nf(7+t*2),.2,'triangle',.12,.06);}},
  coin(){if(S.sfx&&AC){tone(1318,.08,'square',.05);tone(1760,.16,'square',.05,.07);}},
  win(){if(!S.sfx||!AC)return;[0,2,4,5,7,10].forEach((n,i)=>tone(nf(5+n),.3,'triangle',.18,i*.09));},
  lose(){if(!S.sfx||!AC)return;[4,3,2,0].forEach((n,i)=>tone(nf(5+n),.3,'triangle',.15,i*.15));},
  drop(){if(!S.sfx||!AC)return;const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(30,t+.9);f.type='lowpass';f.frequency.setValueAtTime(2400,t);f.frequency.exponentialRampToValueAtTime(120,t+.9);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.001,t+1.1);o.connect(f);f.connect(g);g.connect(sfxG);o.start(t);o.stop(t+1.2);
    const k=AC.createOscillator(),kg=AC.createGain();k.frequency.setValueAtTime(95,t+.45);k.frequency.exponentialRampToValueAtTime(32,t+1.3);kg.gain.setValueAtTime(0,t);kg.gain.setValueAtTime(.95,t+.45);kg.gain.exponentialRampToValueAtTime(.001,t+1.5);k.connect(kg);kg.connect(sfxG);k.start(t);k.stop(t+1.6);noise(.7,.45,'lowpass',900,.45);},
  hit(){if(!S.sfx||!AC)return;noise(.15,.4,'bandpass',900);tone(110,.15,'sine',.3);},
  tick(){if(S.sfx&&AC)tone(nf(15),.06,'sine',.05);}
};
const seq={on:false,next:0,step:0,timer:null,beat:0};
function musicStart(){if(!S.music||!audio()||seq.on)return;seq.on=true;seq.next=AC.currentTime+.08;seq.t0=seq.next;seq.step=0;seq.timer=setInterval(schedule,25);}
function musicStop(){seq.on=false;clearInterval(seq.timer);}
let curVenue=0;const BPM=[86,92,98,126,108,100],FOUR=[0,0,0,1,0,1];
function schedule(){
  const spb=60/BPM[curVenue]/2,four=FOUR[curVenue];
  const BASS=[0,null,null,0,null,null,3,null,0,null,null,0,4,null,3,null];
  const KEYS=[[10,12,14],null,null,null,null,null,null,null,[8,10,13],null,null,null,null,null,null,null];
  while(seq.next<AC.currentTime+.12){
    const s=seq.step%16,t=seq.next-AC.currentTime,bar=Math.floor(seq.step/16)%4;
    if(four?s%4===0:(s===0||s===7||s===10)){const tt=seq.next;const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,tt);o.frequency.exponentialRampToValueAtTime(42,tt+.25);g.gain.setValueAtTime(.8,tt);g.gain.exponentialRampToValueAtTime(.001,tt+.3);o.connect(g);g.connect(musG);o.start(tt);o.stop(tt+.32);setTimeout(()=>{seq.beat=1;},Math.max(0,t*1000));}
    if(s===4||s===12)noise(.16,.3,'bandpass',1900,t,musG);
    if(s%2===1||s===14)noise(.04,.09,'highpass',7500,t,musG);
    const b=BASS[s];if(b!==null)tone(nf(b+(bar===3?-2:0),65.41),spb*1.6,'sawtooth',.16,t,musG);
    const k=KEYS[s];if(k&&bar%2===0)k.forEach(n=>tone(nf(n+(bar===2?-1:0),130.8),spb*7,'sine',.05,t,musG));
    seq.next+=spb;seq.step++;
  }
}

/* ================= DRAWING ================= */
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const TCOL=['#ff4f5e','#3d8bff','#3ddc6a','#ffc83d','#b46cff'];
const TNAME=['Drum','Knob','Keys','Mic','Speaker'];
/* ---- Pop-Up event art (merged into drawIcon via POPI) ---- */
const POPI={};
(function(){

  const star=(c,x,y,r,n=5,ir=.45)=>{c.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr2=i%2?r*ir:r;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}c.closePath();};
  const disc=(c,x,y,r,h,body,lab,ink)=>{h.circ(x,y,r);h.fs(h.rgr(x,y,r,body[0],body[1],body[2]),ink,r*.1);c.strokeStyle='rgba(255,255,255,.14)';c.lineWidth=r*.04;for(const k of[.82,.68,.56]){h.circ(x,y,r*k);c.stroke();}
    if(lab){h.circ(x,y,r*.34);h.fs(lab,ink,r*.05);}h.circ(x,y,r*.07);h.fs('#1a0b33');h.shine(x-r*.4,y-r*.45,r*.28,r*.1,-.7,.45);};
  const bun=(c,x,y,w,h_,H,top)=>{c.beginPath();if(top){c.moveTo(x-w,y);c.quadraticCurveTo(x-w,y-h_,x,y-h_);c.quadraticCurveTo(x+w,y-h_,x+w,y);c.closePath();}else{rr(c,x-w,y,w*2,h_,h_*.45);}H.fs(H.lgr(y-h_,y+h_,'#ffd28a','#d98a2c'),'#5a2e06',w*.09);};
  const patty=(c,x,y,w,H)=>{rr(c,x-w*1.05,y,w*2.1,w*.32,w*.15);H.fs(H.lgr(y,y+w*.32,'#8a4a20','#4a2208'),'#2a1206',w*.07);};

  const lettuce=(c,x,y,w,H)=>{c.beginPath();c.moveTo(x-w*1.1,y);for(let i=0;i<=8;i++)c.quadraticCurveTo(x-w*1.1+i*w*.275-w*.14,y+w*.2,x-w*1.1+i*w*.275,y);c.closePath();H.fs('#5fd04a','#1f6a10',w*.06);};
  const burger=(c,x,y,w,H,dbl)=>{bun(c,x,y+w*(dbl?.62:.36),w,w*.34,H,false);if(dbl){patty(c,x,y+w*.32,w,H);cheese(c,x,y+w*.32,w,H);}patty(c,x,y,w,H);cheese(c,x,y,w,H);lettuce(c,x,y-w*.02,w,H);bun(c,x,y-w*.06,w,w*.7,H,true);

  const fries=(c,x,y,s,H)=>{c.save();for(let i=0;i<6;i++){const fx=x-s*.2+i*s*.08,top=y-s*.3-(i%3)*s*.08;rr(c,fx-s*.035,top,s*.07,s*.4,s*.02);H.fs(H.lgr(top,top+s*.3,'#fff09a','#f0b020'),'#8a5a00',s*.02);}c.restore();
    c.beginPath();c.moveTo(x-s*.28,y-s*.08);c.lineTo(x+s*.28,y-s*.08);c.lineTo(x+s*.2,y+s*.42);c.lineTo(x-s*.2,y+s*.42);c.closePath();H.fs(H.lgr(y-s*.1,y+s*.42,'#ff6a6a','#c41a2a'),'#4a0610',s*.04);
    c.fillStyle='#ffd23d';c.beginPath();c.arc(x,y+s*.15,s*.09,0,P2);c.fill();};
  const cup=(c,x,y,s,H,liq,clear)=>{c.beginPath();c.moveTo(x-s*.26,y-s*.22);c.lineTo(x+s*.26,y-s*.22);c.lineTo(x+s*.19,y+s*.44);c.lineTo(x-s*.19,y+s*.44);c.closePath();
    if(clear){H.fs('rgba(220,240,255,.55)','#1a3a5a',s*.04);c.save();c.clip();c.fillStyle=liq;c.fillRect(x-s*.3,y-s*.08,s*.6,s*.6);c.fillStyle='rgba(255,255,255,.75)';for(const[a,b]of[[-.1,0],[.08,.06],[-.02,.16]]){rr(c,x+a*s-s*.06,y+b*s-s*.06,s*.12,s*.12,s*.03);c.fill();}c.restore();c.strokeStyle='#1a3a5a';c.lineWidth=s*.04;c.stroke();}
    else{H.fs(H.lgr(y-s*.22,y+s*.44,'#ffffff','#d8dce8'),'#2a2a40',s*.04);c.fillStyle='#e82a3a';c.fillRect(x-s*.22,y+s*.02,s*.44,s*.12);}
    rr(c,x-s*.3,y-s*.3,s*.6,s*.1,s*.04);H.fs('#f4f4ff','#2a2a40',s*.035);c.strokeStyle='#2a2a40';c.lineWidth=s*.07;c.beginPath();c.moveTo(x+s*.04,y-s*.28);c.lineTo(x+s*.14,y-s*.48);c.stroke();c.strokeStyle='#ff4f8b';c.lineWidth=s*.045;c.stroke();};

    rr(c,x-s*.14,y+s*.3,s*.28,s*.06,s*.02);H.fs('#e8e8f4','#2a2a40',s*.03);rr(c,x-s*.04,y+s*.36,s*.08,s*.06,0);H.fs('#e8e8f4','#2a2a40',s*.03);
    c.beginPath();for(let i=0;i<3;i++)c.arc(x+(i-1)*s*.13*k,y-s*.16,s*.12*k,Math.PI,P2);c.arc(x,y-s*.28,s*.12*k,Math.PI,P2);H.fs('#fffaf4','#8a7a8a',s*.03);
    c.fillStyle='#e8102a';c.beginPath();c.arc(x+s*.02,y-s*.42,s*.07,0,P2);c.fill();c.strokeStyle='#2a6a10';c.lineWidth=s*.025;c.beginPath();c.moveTo(x+s*.02,y-s*.48);c.quadraticCurveTo(x+s*.06,y-s*.55,x+s*.12,y-s*.54);c.stroke();
    if(big){c.fillStyle='#ff4f8b';for(let i=0;i<3;i++){c.beginPath();c.ellipse(x-s*.2+i*s*.2,y-s*.08+i%2*s*.08,s*.03,s*.06,0,0,P2);c.fill();}for(const col of['#45dcff','#ffd23d','#7dff8a'])for(let i=0;i<3;i++){c.fillStyle=col;c.fillRect(x+(Math.sin(i*7+col.length)*.2)*s,y-s*(.2+i*.04),s*.04,s*.015);}}
    c.strokeStyle='#2a2a40';c.lineWidth=s*.05;c.beginPath();c.moveTo(x-s*.06,y-s*.3);c.lineTo(x-s*.16,y-s*.52);c.stroke();c.strokeStyle='#45dcff';c.lineWidth=s*.03;c.stroke();H.shine(x-s*.12,y,s*.04,s*.1,0,.45);};
  const sleeve=(c,x,y,s,H,col,art)=>{rr(c,x-s*.36,y-s*.36,s*.72,s*.72,s*.04);H.fs(col,'#3a2a10',s*.04);if(art)art();else{c.strokeStyle='rgba(60,40,10,.35)';c.lineWidth=s*.02;H.circ(x,y,s*.22);c.stroke();}H.shine(x-s*.2,y-s*.24,s*.12,s*.04,-.3,.4);};
  const glow=(c,x,y,s,col)=>{return;c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,s*.5);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-s*.5,y-s*.5,s,s);c.restore();};
  Object.assign(POPI,{

function sprite(k,px){
  px=Math.max(8,Math.round(px));const key=k+'|'+px;if(SPR[key])return SPR[key];
  const pad=Math.ceil(px*.16),N=px+pad*2;
  const a=document.createElement('canvas');a.width=a.height=N;
  if(tile3dReady&&TILE_IMG[k]){const ac=a.getContext('2d');ac.imageSmoothingQuality='high';const d=px*1.12;ac.drawImage(TILE_IMG[k],N/2-d/2,N/2-d/2,d,d);
    const o=document.createElement('canvas');o.width=o.height=N;const oc=o.getContext('2d');oc.globalAlpha=.35;oc.filter='blur(2px)';oc.drawImage(a,0,px*.06);oc.filter='none';oc.globalAlpha=1;oc.drawImage(a,0,0);return SPR[key]={c:o,N};}
  drawIcon(a.getContext('2d'),k,N/2,N/2,px);
  const t=document.createElement('canvas');t.width=t.height=N;const tc=t.getContext('2d');tc.drawImage(a,0,0);tc.globalCompositeOperation='source-in';tc.fillStyle='#1a0b33';tc.fillRect(0,0,N,N);
  const o=document.createElement('canvas');o.width=o.height=N;const oc=o.getContext('2d');

  oc.drawImage(a,0,0);
  return SPR[key]={c:o,N};
}

const VENUES=['The Basement','Block Party','Club Midnight','The Warehouse','Sunset Fest','The Arena'];

const CITIES=['Tokyo','London','Lagos','Berlin','São Paulo','Seoul','Paris','Toronto','Mexico City','Sydney'];
const chOf=n=>Math.floor((n-1)/10);
const venueOf=n=>chOf(n)%6;

const venueName=n=>chName(chOf(n));
const chLabel=ch=>ch<6?'Chapter '+(ch+1):'World Tour · Stop '+(ch-5);
const STORY={
  intro:{title:'The Basement',sub:'Chapter 1',lines:[
    ['nova','happy',"Basement's a wreck, but these beats? Fire."],

function getScene(key){if(STORY[key])return STORY[key];const m=/^([se])(\d+)$/.exec(key);if(!m)return null;const ch=+m[2];if(ch<6)return null;const city=CITIES[(ch-6)%CITIES.length];
  return m[1]==='s'?{title:chName(ch),sub:chLabel(ch),lines:[['dex','normal',`Next stop: ${city}. Bigger room, same plan.`],['nova','happy',`${city}, let's go.`]]}
    :{lines:[['nova','happy',`${city} was LOUD.`],['dex','happy','Bus leaves in an hour. Pack the cables.']]};}
const NAMES={get nova(){return curAvatar().name.toUpperCase();},dex:'DEX',bandit:'BOOTLEG BANDIT'},PITCH={nova:12,dex:6,bandit:3};
function playStory(key,then,force){
  const sc=getScene(key);if(!sc||(!force&&S.story[key])){then&&then();return;}
  S.story[key]=1;save();audio();
  const el=$('#story'),pl=$('#stL'),pr=$('#stR'),nm=$('#stName'),tx=$('#stText'),ti=$('#stTitle');
  el.hidden=false;pl.hidden=pr.hidden=true;nm.textContent='';tx.textContent='';let i=-1,timer=null,full='',shown=0,rightWho=null,started=false,done=false;
  const finish=()=>{clearInterval(timer);timer=null;tx.textContent=full;};
  const end=()=>{if(done)return;done=true;clearInterval(timer);el.hidden=true;el.onclick=null;then&&then();};
  const next=()=>{if(timer){finish();return;}i++;if(i>=sc.lines.length){end();return;}ti.hidden=true;el.classList.remove('titling');
    const[who,mood,text]=sc.lines[i];
    if(who==='nova'){const was=pl.hidden;pl.src=portraitURL('nova',mood);pl.hidden=false;if(was){pl.classList.remove('in');void pl.offsetWidth;pl.classList.add('in');}}
    else{const was=pr.hidden||rightWho!==who;pr.src=portraitURL(who,mood);pr.hidden=false;if(was){pr.classList.remove('in');void pr.offsetWidth;pr.classList.add('in');}rightWho=who;}
    pl.classList.toggle('dim',who!=='nova');pr.classList.toggle('dim',who==='nova');
    nm.textContent=NAMES[who];nm.className='st-name '+who;
    full=text.replace(/\bNova\b/g,curAvatar().name);shown=0;tx.textContent='';
    timer=setInterval(()=>{shown+=1;tx.textContent=full.slice(0,shown);if(shown%3===0&&S.sfx&&AC)tone(nf(PITCH[who]+(shown%5)),.04,'square',.025);if(shown>=full.length){clearInterval(timer);timer=null;}},24);};
  el.onclick=()=>{if(!started){started=true;}next();};
  $('#stSkip').onclick=e=>{e.stopPropagation();end();};
  if(sc.title){el.classList.add('titling');ti.innerHTML=`<small>${sc.sub}</small>${sc.title}`;ti.hidden=false;ti.style.animation='none';void ti.offsetWidth;ti.style.animation='';sfx.win();setTimeout(()=>{if(!started){started=true;next();}},1500);}
  else{started=true;next();}
}

function grant(r){for(const[kk,v]of Object.entries(r)){if(kk==='coins')S.coins+=v;else if(kk==='stars')S.stars+=v;else if(kk==='lives')S.lives=Math.min(MAX_LIVES,S.lives+v);else if(kk==='energy'){evInit();S.ev.energy+=v;}else if(kk==='tix'){popInit();S.pop.energy+=v;}else if(kk==='inf'){S.inf=Math.max(Date.now(),S.inf||0)+v*60000;}else if(kk in S.boost)S.boost[kk]+=v;}save();}

    buttons:[{label:`Buy ${ic('coin')} ${b.price*2}`,cls:'gold',disabled:S.coins<b.price*2,onClick:()=>{S.coins-=b.price*2;S.boost[kk]+=3;save();sfx.coin();toast(`+3 ${b.name}`);after&&after();}}]});
}
function openShop(){
  const rows=Object.entries(BOOST).map(([kk,b])=>`<div class="srow"><img src="${iconURL(b.icon)}" alt=""><div><b>${b.name} <span class="num" style="color:var(--muted)">×${S.boost[kk]}</span></b><small>${b.desc}</small></div><button class="btn gold" data-buy="${kk}" ${S.coins<b.price?'disabled':''}>${ic('coin')}${b.price}</button></div>`).join('');
  modal({title:'Shop',body:`<div class="shop">
    <div class="srow"><img src="${iconURL('coin')}" alt=""><div><b>Coin Crate</b><small>+2,500 coins</small></div><button class="btn go" data-coins="2500">$4.99</button></div>
    <div class="srow"><img src="${iconURL('heart')}" alt=""><div><b>Refill Lives</b><small>Back to 5</small></div><button class="btn gold" data-lives="1" ${S.coins<900||S.lives>=MAX_LIVES?'disabled':''}>${ic('coin')}900</button></div>
    ${rows}<p class="note">Prototype store: the $ button is a placeholder and grants coins for free. No real payments.</p></div>`,
    onOpen:m=>{
      m.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const kk=b.dataset.buy;if(S.coins<BOOST[kk].price)return;S.coins-=BOOST[kk].price;S.boost[kk]++;save();sfx.coin();toast('+1 '+BOOST[kk].name);openShop();renderHome();});
      m.querySelector('[data-coins]').onclick=()=>{S.coins+=2500;save();sfx.coin();toast('+2,500 coins');openShop();renderHome();};
      m.querySelector('[data-lives]').onclick=()=>{S.coins-=900;S.lives=MAX_LIVES;S.livesTs=0;save();sfx.coin();openShop();renderHome();};
    }});
}

function drawFloorPat(c,type,bx,bw,wb,VP,W,H,col2){
  const fx=(px,y)=>px+(px-VP.x)*(y-wb)/(wb-VP.y);
  if(type==='wood'||type==='deck'){const N=type==='deck'?8:14;c.strokeStyle=type==='deck'?'rgba(30,14,4,.55)':'rgba(40,18,4,.35)';c.lineWidth=type==='deck'?3:1.5;
    for(let i=-N;i<=2*N;i++){const px=bx+bw*i/N;c.beginPath();c.moveTo(px,wb);c.lineTo(fx(px,H),H);c.stroke();}
    if(type==='wood')for(let j=1;j<9;j++){const y=wb+(H-wb)*Math.pow(j/9,1.6);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}}
  else if(type==='checker'){c.fillStyle=col2;const N=10,M=9;for(let j=0;j<M;j++){const y0=wb+(H-wb)*Math.pow(j/M,1.5),y1=wb+(H-wb)*Math.pow((j+1)/M,1.5);
    for(let i=-N;i<2*N;i++){if(((i+j)%2+2)%2===0)continue;const p0=bx+bw*i/N,p1=bx+bw*(i+1)/N;c.beginPath();c.moveTo(fx(p0,y0),y0);c.lineTo(fx(p1,y0),y0);c.lineTo(fx(p1,y1),y1);c.lineTo(fx(p0,y1),y1);c.closePath();c.fill();}}}
  else if(type==='carpet'){for(let i=0;i<260;i++){c.fillStyle=i%2?'rgba(255,255,255,.07)':'rgba(0,0,0,.14)';c.fillRect((i*73.7)%W,wb+((i*41.3)%(H-wb)),2,2);}}
  else if(type==='epoxy'){c.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<3;i++){const x=W*(.2+i*.3);c.beginPath();c.moveTo(x,wb);c.lineTo(x+20,wb);c.lineTo(x+70,H);c.lineTo(x+30,H);c.fill();}

  else if(type==='marble'){c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=1.2;for(let i=0;i<6;i++){const x0=(i*97)%W;c.beginPath();c.moveTo(x0,wb);c.bezierCurveTo(x0+40,wb+(H-wb)*.3,x0-30,wb+(H-wb)*.6,x0+50,H);c.stroke();}
    c.strokeStyle='rgba(120,110,140,.25)';c.lineWidth=1;for(let j=1;j<7;j++){const y=wb+(H-wb)*Math.pow(j/7,1.5);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}}
}

/* Procedural levels (13+): seeded per level so a level is the same every time you replay it. */
function genProc(n,boss){
  const m=Array.from({length:ROWS},()=>Array(COLS).fill('.'));
  const free=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS&&m[r][c]==='.';
  const sym=(r,c,ch)=>{if(free(r,c))m[r][c]=ch;const c2=COLS-1-c;if(free(r,c2))m[r][c2]=ch;};
  const pick=a=>a[ri(a.length)];
  const types=boss?['cable','case','amp','tape']:['cable','case','amp','tape','pad','gold','color'];
  const nTypes=boss?1:(rand()<.3?1:rand()<.8?2:3);const chosen=[];
  while(chosen.length<nTypes){const t=pick(types);if(!chosen.includes(t))chosen.push(t);}
  if(chosen.length===1&&(chosen[0]==='color'||chosen[0]==='gold'))chosen.push(pick(['cable','case','amp']));
  const shapes=['full','full','topCorners','waist','notch','pillars','steps',...(chosen.includes('gold')?[]:['bottomCorners','funnel'])];
  const shape=pick(shapes);
  if(shape==='topCorners'){sym(0,0,'X');sym(0,1,'X');sym(1,0,'X');}
  if(shape==='bottomCorners'){sym(8,0,'X');sym(7,0,'X');sym(8,1,'X');}
  if(shape==='waist'){sym(3,0,'X');sym(4,0,'X');sym(5,0,'X');}
  if(shape==='notch'){m[0][3]='X';m[1][3]='X';}
  if(shape==='pillars'){sym(3,2,'X');sym(4,2,'X');}
  if(shape==='steps'){sym(0,0,'X');sym(1,0,'X');sym(2,0,'X');sym(0,1,'X');}
  if(shape==='funnel'){for(let r=6;r<9;r++)for(let c=0;c<r-5;c++)sym(r,c,'X');}
  const cabHp=n>8?2:1;
  if(chosen.includes('pad')){const r=1+ri(5);const place=c=>{if(free(r,c)&&free(r,c+1)&&free(r+1,c)&&free(r+1,c+1)){m[r][c]='P';m[r][c+1]='-';m[r+1][c]='-';m[r+1][c+1]='-';}};
    if(rand()<.5){const c=ri(2);place(c);place(COLS-2-c);}else place(2+ri(2));}
  if(chosen.includes('tape')){const r0=2+ri(4),w=1+ri(3),rows=1+ri(2);for(let r=r0;r<r0+rows;r++)for(let c=3-w+1;c<=3;c++)sym(r,c,'T');}
  if(chosen.includes('cable')){const pat=pick(['edges','top','scatter','vee']);
    if(pat==='edges'){const r0=ri(3),len=3+ri(4);for(let r=r0;r<r0+len;r++)sym(r,0,'C');}
    if(pat==='top'){for(let c=0;c<3;c++)if(rand()<.75)sym(0,c,'C');for(let c=0;c<3;c++)if(rand()<.4)sym(1,c,'C');}
    if(pat==='scatter'){const k=3+ri(4);for(let i=0;i<k;i++)sym(ri(8),ri(4),'C');}
    if(pat==='vee'){const r0=1+ri(3);for(let i=0;i<4;i++)sym(r0+i,i,'C');}}
  if(chosen.includes('case')){const pat=pick(['bottom','bottom2','block','ring']);
    if(pat==='bottom')for(let c=0;c<4;c++)sym(8,c,'B');
    if(pat==='bottom2')for(let c=0;c<4;c++){sym(8,c,'B');if(rand()<.6)sym(7,c,'B');}
    if(pat==='block'){const r0=4+ri(3);for(let r=r0;r<r0+2;r++)for(let c=1;c<3;c++)sym(r,c,'B');}
    if(pat==='ring'){const r0=3+ri(3);for(let c=2;c<=3;c++){sym(r0,c,'B');sym(r0+2,c,'B');}sym(r0+1,2,'B');}}
  if(chosen.includes('amp')){const k=1+ri(3);for(let i=0;i<k;i++)sym(1+ri(7),ri(4),'A');}
  if(m[0].filter(ch=>ch==='.').length<2){m[0][2]='.';m[0][4]='.';}
  const cnt={C:0,B:0,A:0,T:0,P:0};m.forEach(row=>row.forEach(ch=>{if(ch in cnt)cnt[ch]++;}));
  let work=cnt.C*cabHp*.6+cnt.B*.7+cnt.A*1.8+cnt.T*.6+cnt.P*4.5,gold=0,color=0;
  if(chosen.includes("gold")){gold=2+ri(3);work+=gold*3.5;}
  if(chosen.includes('color')){color=16+ri(4)*4+Math.min(10,Math.floor(n/10)*2);work+=color/4;}
  if(work<4){for(let c=0;c<4;c++)sym(8,c,'B');work+=5;}
  const nc=rand()<.22?4:5;
  const moves=Math.max(18,Math.min(34,Math.round(16+work*.55)))-(nc===4?2:0)-Math.min(3,Math.floor(chOf(n)/2));
  return{m:m.map(r=>r.join('')),moves,gold,color,nc,proc:true,shape};
}

function swapG(r1,c1,r2,c2){const a=G[r1][c1],b=G[r2][c2];G[r1][c1]=b;G[r2][c2]=a;if(a){a.r=r2;a.c=c2;a.lerp=true;}if(b){b.r=r1;b.c=c1;b.lerp=true;}}
function findMove(){

function applyGravity(){

  for(let i=dying.length-1;i>=0;i--){const d=dying[i];d.t+=dt;const f=1-d.t/.2;if(f<=0){dying.splice(i,1);continue;}c.save();c.globalAlpha=f;drawSpr(c,d.o.p||(d.o.gold?'gold':'t'+d.o.color),cx(d.o.x),cy(d.o.y),base*(1+(1-f)*.5),base);c.restore();}

    c.save();c.globalAlpha=ph>.85?1-(ph-.85)/.15:1;drawSpr(c,'hand',hx+cs*.08,hy+cs*.4+cs*.1,cs*1.0);c.restore();}

function updTile(o,dt){
  if(o.lerp){const kk=Math.min(1,dt*16);o.x+=(o.c-o.x)*kk;o.y+=(o.r-o.y)*kk;if(Math.abs(o.x-o.c)<.02&&Math.abs(o.y-o.r)<.02){o.x=o.c;o.y=o.r;o.lerp=false;o.vy=0;}}
  else{if(o.y<o.r){o.vy=Math.min(o.vy+dt*60,24);o.y=Math.min(o.r,o.y+o.vy*dt);if(o.y===o.r){if(o.vy>4)o.sq=.18;o.vy=0;}}else if(o.y>o.r){o.y=o.r;}
    o.x+=(o.c-o.x)*Math.min(1,dt*14);if(Math.abs(o.x-o.c)<.02)o.x=o.c;}
  o.sc+=(1-o.sc)*Math.min(1,dt*10);if(o.sq)o.sq=Math.max(0,o.sq-dt);
}
function drawTile(c,o,t,base){

    c.translate(x,y);c.rotate(Math.sin(t*3+o.c)*.06);c.translate(-x,-y);}
  drawSpr(c,o.p||(o.gold?'gold':'t'+o.color),x,y,s,base);

function drawPad(c,p,t){

    {const k=cam.k,sc=1+(cam.z-1)*k;bgx.save();if(k>0){bgx.translate((AW/2-cam.f.x*cam.z)*k,(AH*cam.fy-cam.f.y*cam.z)*k);bgx.scale(sc,sc);}drawStudio(bgx,AW,AH,t);drawWorkFx(bgx,dt);bgx.restore();}
    if(acc>1){acc=0;tickLives();livesUI();homeTimers();}}
  // flying pickups
  fxx.setTransform(DPR,0,0,DPR,0,0);fxx.clearRect(0,0,AW,AH);
  for(let i=flyers.length-1;i>=0;i--){const f=flyers[i];f.t+=dt;const u=Math.min(1,f.t/f.life),e=u*u*(3-2*u);const x=f.x0+(f.x1-f.x0)*e+Math.sin(u*Math.PI)*30*(f.x0<f.x1?-1:1),y=f.y0+(f.y1-f.y0)*e-Math.sin(u*Math.PI)*40;
    drawSpr(fxx,f.k,x,y,cs*(1-u*.35),cs);if(u>=1){flyers.splice(i,1);f.el.classList.remove('bump');void f.el.offsetWidth;f.el.classList.add('bump');sfx.tick();}}
  requestAnimationFrame(loop);
}

<style>

  background:linear-gradient(#8bff9f,#3fe06e 45%,#13923d);color:#fff;font:20px 'Lilita One',Impact,sans-serif;-webkit-text-stroke:4px rgba(26,11,51,.85);paint-order:stroke fill;box-shadow:0 4px 0 #1a0b33}
</style>
<button id="updBtn" hidden>Update ready · Tap</button>
<script>
/* Self-updater: home-screen apps on iPhone resume instead of reloading, so check for a newer build
   whenever the app comes to the front. Reload automatically on safe screens; otherwise show a button. */
(()=>{const BUILD='1794029087';let ready=false,checking=false;
  const btn=document.getElementById('updBtn');
  const safe=()=>{const g=document.getElementById('game'),m=document.getElementById('modal'),st=document.getElementById('story');return g&&g.hidden&&m&&m.hidden&&st&&st.hidden;};
  const go=()=>{location.reload();};
  btn.onclick=go;
  async function check(){if(checking)return;checking=true;
    try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const v=await r.json();
      if(v.build&&v.build!==BUILD){ready=true;try{const reg=await navigator.serviceWorker?.getRegistration();await reg?.update();}catch(e){}
        if(safe())go();else btn.hidden=false;}}}catch(e){}
    checking=false;}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});
  window.addEventListener('pageshow',check);window.addEventListener('focus',check);
  setInterval(()=>{if(ready&&safe())go();else check();},60000);
  setTimeout(check,1500);
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));}
</script>
